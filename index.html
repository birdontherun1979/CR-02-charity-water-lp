<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity: Water</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header / brand bar -->
  <header class="top-bar">
    <img src="img/water-can-transparent.png" alt="Water can icon" class="brand-icon">
    <h1>Charity: Water</h1>
    <img src="img/water-can-transparent.png" alt="Water can icon" class="brand-icon brand-icon-right">
  </header>

  <!-- Main hero section -->
  <main class="hero-wrap">
    <section class="hero-section">
      <!-- Center text block -->
      <div class="text-panel">
        <p class="line line-1">No donation is small</p>
        <p class="line line-2">Be the change</p>
        <p class="line line-3">Donate today</p>

        <p class="supporting-text">
          Charity: Water is looking to you to help them make a difference.
        </p>

        <p class="supporting-text">
          Any donation amount helps us achieve our global mission of clean safe drinking water.
        </p>

        <a href="https://www.charitywater.org/donate" class="cta-button" target="_blank">Give some clean water today</a>
      </div>

      <!-- Right visual: child drinking water -->
      <div class="visual right-visual">
        <img src="img/Screenshot 2026-08-29 221518.png" alt="A child drinking clean water from a tap">
        <div class="visual-border"></div>
      </div>
    </section>
  </main>
</body>
</html>
