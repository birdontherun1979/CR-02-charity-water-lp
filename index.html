<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity: Water</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header / brand bar -->
  <header class="top-bar">
    <div class="cw_logo-2.png" aria-hidden="true"></div>
    <h1>Charity: Water</h1>
    <div class="cw_logo-2.png" aria-hidden="true"></div>
  </header>

  <!-- Main hero section -->
  <main class="hero-wrap">
    <section class="hero-section">
      <!-- Left visual: dirty water and tank -->
      <div class="visual left-visual">
        <img src="https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=900&q=80" alt="Dirty water being poured from a tap into a container">
      </div>

      <!-- Center text block -->
      <div class="text-panel">
        <p class="line line-1">No donation is small</p>
        <p class="line line-2">Be the change</p>
        <p class="line line-3">Donate today</p>

        <p class="supporting-text">
          Charity: Water is looking to you to help them make a difference.
        </p>

        <p class="supporting-text">
          Any donation amount helps us achieve our global mission of clean safe drinking water.
        </p>

        <a href="#" class="cta-button">Give some clean water today</a>
      </div>

      <!-- Right visual: child drinking water -->
      <div class="visual right-visual">
        <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=900&q=80" alt="A child drinking clean water from a tap">
      </div>
    </section>
  </main>
</body>
</html>
